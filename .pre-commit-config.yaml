# Pre-commit configuration for AegisGate
# See https://pre-commit.com for more information

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=500"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^frontend/
        exclude: ^frontend/node_modules/|.*\.generated\.ts$

  - repo: local
    hooks:
      - id: block-db-files
        name: Block database files from being committed
        entry: Database files (*.db, *.sqlite3) must never be committed to git. Use git rm --cached.
        language: fail
        files: \.(db|sqlite3|db-wal|db-shm)$

