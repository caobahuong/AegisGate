[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisgate"
version = "1.0.0"
description = "Enterprise AI Execution Proxy and Pluggable Harness Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "AegisGate contributors" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.22",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
sqlserver = [
    "pyodbc>=5.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "playwright>=1.46.0",
    "httpx>=0.27.0",
    "psutil>=5.9.0",
]

[tool.setuptools.package-dir]
"" = "."
aegisgate_sdk = "sdk/aegisgate_sdk"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "plugins*", "sdk*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402", "W293", "E741", "F841", "E711", "E712"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
show_error_codes = true


