[pytest]
pythonpath = .
asyncio_mode = auto
testpaths = tests
markers =
    unit: Isolated fast unit tests
    integration: Live database integration tests requiring external SQL Server
    e2e: End-to-end browser and full workflow tests
    load: Performance and stress tests
    slow: Tests taking more than 5 seconds
    audit: Full-system defect and audit verification tests
addopts = -q -m "not integration and not e2e and not load"
